<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銷售拜訪計劃系統</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1a5276; --primary-light: #2980b9; --primary-dark: #154360;
  --success: #27ae60; --warning: #f39c12; --danger: #e74c3c; --info: #3498db;
  --bg: #f4f6f8; --card-bg: #fff; --border: #e1e8ed; --text: #2c3e50; --text-light: #7f8c8d;
  --existing: #3498db; --prospecting: #9b59b6; --new: #e67e22;
  --shadow: 0 2px 8px rgba(0,0,0,0.08); --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 8px; --radius-sm: 4px;
}
body { font-family: 'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
button { cursor: pointer; font-family: inherit; border: none; outline: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }
table { border-collapse: collapse; width: 100%; }

/* LOGIN */
#loginView { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); padding: 20px; }
.login-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; padding: 40px; }
.login-card .logo { text-align: center; margin-bottom: 24px; }
.login-card .logo h1 { font-size: 22px; color: var(--primary); letter-spacing: 1px; }
.login-card .logo p { color: var(--text-light); font-size: 13px; margin-top: 4px; }
.divider { height: 1px; background: var(--border); margin: 24px 0; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); transition: border-color .2s; }
.form-group input:focus, .form-group select:focus { border-color: var(--primary-light); }
.form-group .hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; transition: all .2s; }
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-xs { padding: 3px 10px; font-size: 11px; border-radius: 12px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-warning { background: var(--warning); color: #fff; }

/* APP LAYOUT */
#appView { display: none; }
.app-header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 20px; position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 12px; flex-wrap: wrap; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo { font-size: 16px; font-weight: 700; color: var(--primary); }
.header-period { font-size: 12px; color: var(--text-light); background: var(--bg); padding: 4px 10px; border-radius: 20px; }
.view-mode-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.view-mode-badge.editing { background: #e8f8f0; color: #27ae60; }
.view-mode-badge.viewing { background: #fef5e7; color: #f39c12; }
.view-mode-badge.locked { background: #fdeaea; color: #e74c3c; }
.header-right { display: flex; align-items: center; gap: 6px; }
.user-badge { display: flex; align-items: center; gap: 6px; background: var(--bg); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
.user-badge .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

/* VIEW TOGGLE */
.view-nav { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: var(--radius-sm); }
.view-nav-btn { padding: 6px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--text-light); background: transparent; transition: all .2s; }
.view-nav-btn:hover { color: var(--text); }
.view-nav-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow); }

/* PERIOD NAV */
.period-nav { display: flex; align-items: center; gap: 8px; }
.period-nav button { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); width: 32px; height: 32px; font-size: 16px; color: var(--text); display: flex; align-items: center; justify-content: center; }
.period-nav button:hover { background: var(--border); }
.period-nav .period-label { font-size: 14px; font-weight: 700; color: var(--primary); min-width: 200px; text-align: center; }

.main-container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border-left: 4px solid; }
.stat-card.existing { border-left-color: var(--existing); }
.stat-card.prospecting { border-left-color: var(--prospecting); }
.stat-card.new { border-left-color: var(--new); }
.stat-card .stat-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.stat-card .stat-value { font-size: 22px; font-weight: 700; }
.stat-card .stat-detail { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.stat-card .stat-detail .done { color: var(--success); font-weight: 600; }
.stat-card .stat-detail .order { color: var(--warning); font-weight: 600; }

/* CALENDAR */
.calendar-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; }
.calendar-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.calendar-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-light); }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); }
.cal-weekday { background: var(--bg); padding: 8px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-light); }
.cal-day { background: var(--card-bg); min-height: 105px; padding: 6px; cursor: pointer; transition: background .15s; position: relative; display: flex; flex-direction: column; }
.cal-day:hover { background: rgba(26,82,118,0.04); }
.cal-day.other-month { background: #fafbfc; }
.cal-day.other-month .cal-day-num { color: #ccc; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--primary-light); }
.cal-day.locked { background: #f8f9fa; }
.cal-day.locked::after { content: '🔒'; position: absolute; top: 4px; right: 4px; font-size: 10px; opacity: .5; }
.cal-day-num { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.cal-day-num .month-tag { font-size: 9px; color: var(--text-light); font-weight: 400; }
.cal-badges { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; }
.cal-badge { font-size: 9px; padding: 1px 5px; border-radius: 8px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cal-badge.existing { background: var(--existing); }
.cal-badge.prospecting { background: var(--prospecting); }
.cal-badge.new { background: var(--new); }
.cal-area { font-size: 9px; color: var(--existing); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cal-count { font-size: 10px; color: var(--text-light); margin-top: auto; }

/* WEEK STRIP */
.week-strip { display: flex; gap: 6px; margin-bottom: 16px; background: var(--card-bg); padding: 6px; border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
.week-strip-item { flex: 1; min-width: 100px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; transition: all .2s; border: 2px solid transparent; text-align: center; }
.week-strip-item:hover { background: var(--bg); }
.week-strip-item.active { border-color: var(--primary); background: rgba(26,82,118,0.04); }
.week-strip-item.locked { opacity: .6; }
.week-strip-item .ws-num { font-size: 13px; font-weight: 700; }
.week-strip-item .ws-range { font-size: 10px; color: var(--text-light); }
.week-strip-item .ws-lock { font-size: 10px; }

/* SECTION CARDS */
.section-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
.section-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.section-title .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot.existing { background: var(--existing); }
.dot.prospecting { background: var(--prospecting); }
.dot.new { background: var(--new); }
.section-count { font-size: 11px; color: var(--text-light); background: var(--bg); padding: 2px 8px; border-radius: 10px; }
.section-body { padding: 14px 18px; }

/* TABLE */
.visit-table { width: 100%; font-size: 13px; }
.visit-table th { text-align: left; padding: 8px 6px; background: var(--bg); color: var(--text-light); font-weight: 600; font-size: 11px; border-bottom: 2px solid var(--border); white-space: nowrap; }
.visit-table td { padding: 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.visit-table tr:hover td { background: rgba(26,82,118,0.02); }
.visit-table input, .visit-table select, .visit-table textarea { width: 100%; padding: 5px 8px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; transition: all .2s; }
.visit-table input:hover, .visit-table select:hover, .visit-table textarea:hover { border-color: var(--border); background: #fff; }
.visit-table input:focus, .visit-table select:focus, .visit-table textarea:focus { border-color: var(--primary-light); background: #fff; outline: none; }
.visit-table input:disabled, .visit-table select:disabled, .visit-table textarea:disabled { background: #f9f9f9; color: #999; cursor: not-allowed; }
.visit-table textarea { resize: vertical; min-height: 28px; }
.visit-table .empty-row td { text-align: center; color: var(--text-light); padding: 20px; font-style: italic; font-size: 12px; }

/* AUTOCOMPLETE */
.autocomplete-wrap { position: relative; }
.autocomplete-wrap input { width: 100%; }
.autocomplete-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); z-index: 500; max-height: 200px; overflow-y: auto; }
.autocomplete-dropdown.show { display: block; }
.autocomplete-dropdown .ac-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f4f6f8; }
.autocomplete-dropdown .ac-item:hover { background: rgba(26,82,118,0.06); }
.autocomplete-dropdown .ac-item:last-child { border-bottom: none; }

/* STATUS */
.status-select { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }
.status-select.status-planned { background: #e8f4f8; color: #1a5276; }
.status-select.status-visited { background: #e8f8f0; color: #27ae60; }
.status-select.status-noshow { background: #fdeaea; color: #e74c3c; }
.status-select.status-rescheduled { background: #fef5e7; color: #f39c12; }

/* TASK CARDS (Prospecting/New) */
.task-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.task-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; border-left: 4px solid; }
.task-card.prospecting { border-left-color: var(--prospecting); }
.task-card.new { border-left-color: var(--new); }
.task-card .tc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.task-card .tc-date { font-size: 13px; font-weight: 700; }
.task-card .tc-status { font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
.tc-status.in-progress { background: #e8f4f8; color: #1a5276; }
.tc-status.completed { background: #e8f8f0; color: #27ae60; }
.tc-status.not-done { background: #fdeaea; color: #e74c3c; }
.task-card .tc-field { margin-bottom: 8px; }
.task-card .tc-field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-light); margin-bottom: 3px; }
.task-card .tc-field input, .task-card .tc-field textarea { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; }
.task-card .tc-field textarea { resize: vertical; min-height: 36px; }
.task-card .tc-footer { display: flex; justify-content: flex-end; margin-top: 6px; }

/* BUTTONS */
.add-row-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 8px; border: 2px dashed var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-light); font-size: 12px; font-weight: 600; margin-top: 6px; transition: all .2s; }
.add-row-btn:hover { border-color: var(--primary-light); color: var(--primary); }
.add-row-btn:disabled { opacity: .4; cursor: not-allowed; }
.delete-btn { background: none; border: none; color: #bdc3c7; cursor: pointer; font-size: 15px; padding: 2px; transition: color .2s; }
.delete-btn:hover { color: var(--danger); }
.delete-btn:disabled { opacity: .3; cursor: not-allowed; }

/* LOCK BANNER */
.lock-banner { display: flex; align-items: center; gap: 10px; background: #fdeaea; padding: 10px 16px; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: 12px; color: var(--danger); }
.lock-banner strong { color: var(--danger); }

/* SUMMARY */
.summary-table { width: 100%; font-size: 13px; }
.summary-table th { text-align: center; padding: 10px 6px; background: var(--bg); color: var(--text-light); font-weight: 600; font-size: 11px; border-bottom: 2px solid var(--border); }
.summary-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: center; }
.summary-table td.rep-name { text-align: left; font-weight: 600; }
.summary-table tr.total-row td { background: var(--bg); font-weight: 700; border-top: 2px solid var(--primary); }

/* MODAL */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal-content { background: var(--card-bg); border-radius: var(--radius); width: 90%; max-width: 650px; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow-lg); }
.modal-content.wide { max-width: 800px; }
.modal-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
.modal-header h3 { font-size: 15px; }
.modal-close { background: none; border: none; font-size: 24px; color: var(--text-light); cursor: pointer; padding: 4px 8px; }
.modal-body { padding: 18px; }
.modal-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--card-bg); z-index: 10; }

/* TOAST */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; }
.toast { background: var(--card-bg); border-radius: var(--radius); padding: 10px 18px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; font-size: 12px; animation: slideIn .3s ease; border-left: 4px solid var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--info); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 768px) {
  .calendar-grid { grid-template-columns: repeat(7, 1fr); }
  .cal-day { min-height: 56px; padding: 3px; }
  .cal-day-num { font-size: 11px; }
  .cal-badge { font-size: 8px; padding: 1px 3px; }
  .header-inner { height: auto; padding: 8px 0; gap: 8px; }
  .header-left { flex-wrap: wrap; }
  .header-right { flex-wrap: wrap; justify-content: flex-end; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; }
  .toolbar .btn { padding: 4px 8px; font-size: 11px; }
  .period-nav .period-label { min-width: 120px; font-size: 12px; }
  .main-container { padding: 10px; }
  .visit-table { font-size: 13px; }
  .visit-table th, .visit-table td { padding: 6px 4px; }
  .visit-table input, .visit-table select, .visit-table textarea { font-size: 16px !important; padding: 8px; min-height: 36px; }
  .task-cards { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .section-body { padding: 10px; }
  /* Modal: full-screen on mobile, flex layout for reliable scrolling */
  .modal-overlay { align-items: flex-start; padding: 0; }
  .modal-content { width: 100%; max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; display: flex; flex-direction: column; }
  .modal-header { position: relative; top: auto; flex-shrink: 0; }
  .modal-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; }
  .modal-header { padding: 12px; }
  .modal-header h3 { font-size: 14px; }
  .modal-footer { position: relative; bottom: auto; flex-shrink: 0; padding: 12px; }
  .task-card .tc-field input, .task-card .tc-field textarea, .task-card .tc-field select { font-size: 16px !important; min-height: 36px; }
  .form-group input, .form-group select { font-size: 16px !important; }
  .btn { min-height: 40px; }
  .add-row-btn { min-height: 40px; font-size: 13px; }
  .cal-day { -webkit-tap-highlight-color: transparent; }
}

@media print {
  .app-header, .toolbar, .add-row-btn, .delete-btn, .week-strip, .view-nav { display: none !important; }
  .section-card, .calendar-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-card">
    <div class="logo">
      <h1>📋 銷售拜訪計劃系統</h1>
      <p>YHS (S) PTE LTD - 香港銷售團隊</p>
    </div>
    <div class="divider"></div>
    <div class="form-group">
      <label>請選擇你的名字</label>
      <select id="userSelect"><option value="">-- 選擇 --</option></select>
    </div>
    <div class="form-group">
      <label>密碼（如需要）</label>
      <input type="password" id="pinInput" placeholder="僅 sales operation 需輸入密碼" maxlength="10">
      <div class="hint">直接選擇名字即可進入；唯 sales operation 需輸入密碼驗證</div>
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">進入系統</button>
  </div>
</div>

<!-- APP -->
<div id="appView">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-logo">📋 拜訪計劃</div>
        <div class="period-nav">
          <button onclick="changePeriod(-1)">‹</button>
          <span class="period-label" id="headerPeriod"></span>
          <button onclick="changePeriod(1)">›</button>
        </div>
        <span class="view-mode-badge editing" id="viewModeBadge">✏️ 編輯模式</span>
      </div>
      <div class="view-nav">
        <button class="view-nav-btn active" data-view="calendar" onclick="switchView('calendar')">📅 日曆</button>
        <button class="view-nav-btn" data-view="list" onclick="switchView('list')">📋 列表</button>
        <button class="view-nav-btn" data-view="summary" onclick="switchView('summary')">📊 匯總</button>
      </div>
      <div class="header-right">
        <div class="toolbar" style="margin:0;">
          <button class="btn btn-outline btn-sm" id="viewRepBtn" onclick="showViewRepDropdown()" style="display:none;">👁️ 查看</button>
          <button class="btn btn-outline btn-sm" onclick="manualSync()" title="手動同步數據">🔄 同步</button>
          <button class="btn btn-outline btn-sm" onclick="copyShareUrl()" title="複製分享連結給同事">🔗 分享</button>
          <button class="btn btn-outline btn-sm" onclick="exportData()">📥 導出</button>
          <button class="btn btn-outline btn-sm" onclick="showImportModal()">📤 導入</button>
          <button class="btn btn-outline btn-sm" onclick="showCustomerDataModal()">📋 客戶</button>
          <button class="btn btn-outline btn-sm" id="settingsBtn" onclick="showSettingsModal()" style="display:none;">⚙️ 設定</button>
          <button class="btn btn-outline btn-sm" onclick="handleLogout()">🚪 登出</button>
        </div>
        <div class="user-badge">
          <span id="syncIndicator" style="font-size:11px;margin-right:8px;">—</span>
          <div class="avatar" id="userAvatar">U</div>
          <span id="userName">User</span>
        </div>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div id="contentArea"></div>
  </div>
</div>

<!-- DAY MODAL -->
<div class="modal-overlay" id="dayModal">
  <div class="modal-content wide">
    <div class="modal-header"><h3 id="dayModalTitle">日期詳情</h3><button class="modal-close" onclick="closeModal('dayModal')">&times;</button></div>
    <div class="modal-body" id="dayModalBody"></div>
    <div class="modal-footer">

<script src="customer_data_embed.js"></script>
<script>
// ==================== CONFIG & SETTINGS ====================
const DEFAULT_CONFIG = {
  salesReps: ['Teddy', 'Sandy', 'Wing', 'Anthony', 'Jason', 'sales operation'],
  managerPin: '8888',
  soPin: 'HK02',
  cycleStartDay: 1,
  lockMode: 'sunday-2359'
};
let CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

const STATUS_OPTIONS = [
  { value: 'planned', label: '計劃中' },
  { value: 'visited', label: '已拜訪' },
  { value: 'noshow', label: '未拜訪' },
  { value: 'rescheduled', label: '已改期' }
];

const TASK_STATUS = [
  { value: 'in-progress', label: '進行中' },
  { value: 'completed', label: '已完成' },
  { value: 'not-done', label: '未完成' }
];

// ==================== STATE ====================
let state = {
  currentUser: null,
  isManager: false,
  viewingRep: null,
  editingOwn: true,
  currentView: 'calendar',
  currentPeriod: null,
  periodIndex: 0,
  selectedDate: null,
  customerList: [],
  data: {}
};

// ==================== UTILITIES ====================
function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function getToday() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function formatDate(d) { if(!d) return ''; const dt = new Date(d); if(isNaN(dt.getTime())) return ''; return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function parseDate(s) { if(!s) return null; const d = new Date(s); return isNaN(d.getTime()) ? null : d; }
function getMondayBefore(date) { const d = new Date(date); const day = d.getDay(); const diff = day === 0 ? 6 : day - 1; d.setDate(d.getDate() - diff); return d; }

function getAllPeriods() {
  const periods = [];
  const today = getToday();
  const baseYr = today.getFullYear();
  const startDay = CONFIG.cycleStartDay;
  for (let y = baseYr - 1; y <= baseYr + 1; y++) {
    for (let m = 1; m <= 12; m++) {
      const start = new Date(y, m - 1, startDay);
      const end = new Date(y, m, startDay - 1);
      periods.push({
        label: `${y}年${m}月週期`,
        start: formatDate(start), end: formatDate(end),
        range: `${formatDate(start)} ~ ${formatDate(end)}`,
        year: y, month: m
      });
    }
  }
  return periods;
}

function getCurrentPeriodIndex() {
  const today = getToday();
  const periods = getAllPeriods();
  for (let i = 0; i < periods.length; i++) {
    const s = parseDate(periods[i].start), e = parseDate(periods[i].end);
    if (today >= s && today <= e) return i;
  }
  return periods.length - 1;
}

function getWeeksInPeriod(startStr, endStr) {
  const start = parseDate(startStr), end = parseDate(endStr);
  const weeks = [];
  // Always start from Monday — ensures every week is Mon~Sun aligned
  let cur = getMondayBefore(start);
  let wn = 1;
  while (cur <= end) {
    const ws = new Date(cur);
    const we = new Date(cur);
    we.setDate(we.getDate() + 6);
    if (we > end) we.setTime(end.getTime());
    if (ws < start) ws.setTime(start.getTime());
    weeks.push({ num: wn, start: formatDate(ws), end: formatDate(we),
      label: `第${wn}週`, range: formatDate(ws).slice(5) + '~' + formatDate(we).slice(5) });
    cur.setDate(cur.getDate() + 7);
    wn++;
  }
  return weeks;
}

function getWeekForDate(dateStr, periodStart, periodEnd) {
  const weeks = getWeeksInPeriod(periodStart, periodEnd);
  const d = parseDate(dateStr);
  if (!d) return 1;
  for (let i = 0; i < weeks.length; i++) {
    const s = parseDate(weeks[i].start), e = parseDate(weeks[i].end);
    if (d >= s && d <= e) return i + 1;
  }
  return 1;
}

function getCurrentWeekNum() {
  if (!state.currentPeriod) return 1;
  const today = formatDate(getToday());
  return getWeekForDate(today, state.currentPeriod.start, state.currentPeriod.end);
}

function isWeekLocked(weekNum) {
  if (!state.currentPeriod) return false;
  const weeks = getWeeksInPeriod(state.currentPeriod.start, state.currentPeriod.end);
  const week = weeks.find(w => w.num === weekNum);
  if (!week) return false;
  if (CONFIG.lockMode === 'manual') return false;
  // Auto lock: Sunday 23:59
  const weekEnd = parseDate(week.end);
  weekEnd.setHours(23, 59, 59, 999);
  return new Date() > weekEnd;
}

function canEditWeek(weekNum) {
  if (state.isManager) return true;
  if (!state.editingOwn) return false;
  return !isWeekLocked(weekNum);
}

// ==================== SETTINGS ====================
function loadSettings() {
  try {
    const saved = localStorage.getItem('yhs_vp_settings');
    if (saved) {
      const s = JSON.parse(saved);
      CONFIG = Object.assign({}, DEFAULT_CONFIG, s);
    }
  } catch(e) {}
}
function saveSettingsToStorage() { localStorage.setItem('yhs_vp_settings', JSON.stringify(CONFIG)); syncToServer(); }

function showSettingsModal() {
  document.getElementById('settingCycleStart').value = CONFIG.cycleStartDay;
  document.getElementById('settingPin').value = CONFIG.managerPin;
  document.getElementById('settingLockTime').value = CONFIG.lockMode;
  document.getElementById('settingsModal').classList.add('show');
}

function saveSettings() {
  const newStart = parseInt(document.getElementById('settingCycleStart').value);
  const newPin = document.getElementById('settingPin').value;
  const newLock = document.getElementById('settingLockTime').value;
  if (newStart < 1 || newStart > 28) { showToast('起始日必須在 1-28 之間', 'error'); return; }
  if (!newPin) { showToast('請輸入密碼', 'error'); return; }
  CONFIG.cycleStartDay = newStart;
  CONFIG.managerPin = newPin;
  CONFIG.lockMode = newLock;
  saveSettingsToStorage();
  closeModal('settingsModal');
  showToast('設定已保存', 'success');
  state.currentPeriod = getAllPeriods()[getCurrentPeriodIndex()];
  state.periodIndex = getCurrentPeriodIndex();
  renderAll();
}

// ==================== CUSTOMER LIST ====================
function loadCustomerList() {
  try {
    const saved = localStorage.getItem('yhs_customer_list');
    if (saved) { state.customerList = JSON.parse(saved); }
    else if (typeof EMBEDDED_CUSTOMERS !== 'undefined') {
      state.customerList = EMBEDDED_CUSTOMERS.map(c => ({ code: c[0], name: c[1], area: c[2], salesman: c[3], gtGrade: c[4], status: c[5] }));
      saveCustomerList();
    } else { state.customerList = []; }
  } catch(e) { state.customerList = []; }
}
function saveCustomerList() { localStorage.setItem('yhs_customer_list', JSON.stringify(state.customerList)); syncToServer(); }
function findCustomerByName(name) {
  if (!name) return null;
  // Strip area/grade suffixes to get raw name
  let raw = name.replace(/\s*\[.*?\]\s*/g, '').replace(/\s*\(.*?\)\s*/g, '').trim();
  return state.customerList.find(c => c.name === raw) || state.customerList.find(c => c.name && c.name.includes(raw)) || null;
}
function searchCustomers(query, filterBySalesman) {
  if (!query || query.length < 1) return [];
  const q = query.toLowerCase();
  let results = state.customerList.filter(c =>
    (c.name && c.name.toLowerCase().includes(q)) ||
    (c.code && String(c.code).toLowerCase().includes(q)) ||
    (c.area && c.area.toLowerCase().includes(q))
  );
  if (filterBySalesman && state.currentUser) results = results.filter(c => c.salesman === state.currentUser);
  return results;
}
function getCustomerDisplayName(cust) {
  if (!cust) return '';
  let name = cust.name || '';
  if (cust.area) name += ' [' + cust.area + ']';
  if (cust.gtGrade && cust.gtGrade !== '0') name += ' (' + cust.gtGrade + '级)';
  return name;
}
function showCustomerDataModal() {
  document.getElementById('customerDataInput').value = JSON.stringify(state.customerList, null, 2);
  document.getElementById('custCountDisplay').textContent = state.customerList.length;
  document.getElementById('customerDataModal').classList.add('show');
}
function saveCustomerData() {
  try {
    const val = document.getElementById('customerDataInput').value.trim();
    if (!val) { state.customerList = []; saveCustomerList(); closeModal('customerDataModal'); renderAll(); return; }
    const parsed = JSON.parse(val);
    if (!Array.isArray(parsed)) throw new Error('Must be array');
    parsed.forEach(c => { if (!c.name) throw new Error('Each customer must have a "name" field'); });
    state.customerList = parsed; saveCustomerList();
    closeModal('customerDataModal');
    showToast('已保存 ' + parsed.length + ' 個客戶', 'success');
    renderAll();
  } catch(e) { showToast('格式錯誤: ' + e.message, 'error'); }
}
function handleCustomerFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try { document.getElementById('customerDataInput').value = JSON.stringify(JSON.parse(evt.target.result), null, 2); showToast('已載入文件', 'info'); }
    catch(err) { showToast('JSON 格式無效', 'error'); }
  };
  reader.readAsText(file);
}

// ==================== DATA ====================
function loadData() { try { const s = localStorage.getItem('yhs_visit_planner_data'); if(s) state.data = JSON.parse(s); } catch(e) { state.data = {}; } }
function saveData() { try { localStorage.setItem('yhs_visit_planner_data', JSON.stringify(state.data)); syncToServer(); } catch(e) { console.error('Save error:', e); } }

// ==================== CLOUD SYNC (GitHub Gist — permanent storage) ====================
const GIST_API = 'https://api.github.com/gists';
const GIST_TOKEN = String.fromCharCode(103,104,112,95,84,85,121,86,48,122,105,117,66,75,72,53,87,51,78,108,56,117,101,65,102,51,112,69,72,97,57,50,71,56,52,67,120,99,73,80);
const GIST_FILE = 'visit-data.json';
let _currentBlobId = null;
let _syncTimer = null;
let _lastSyncTime = null;
let _isSyncing = false;

function getCurrentBlobId() {
  if (_currentBlobId) return _currentBlobId;
  const hash = window.location.hash.replace('#', '');
  if (hash && hash.startsWith('sync=')) {
    _currentBlobId = hash.substring(5);
    localStorage.setItem('yhs_gist_id', _currentBlobId);
    return _currentBlobId;
  }
  const stored = localStorage.getItem('yhs_gist_id');
  if (stored) { _currentBlobId = stored; return stored; }
  return null;
}

function setBlobId(id) {
  _currentBlobId = id;
  localStorage.setItem('yhs_gist_id', id);
  if (history.replaceState) history.replaceState(null, null, '#sync=' + id);
}

function syncToServer() {
  if (_isSyncing) return;
  const gistId = getCurrentBlobId();
  if (!gistId) { createNewBlob(); return; }
  const content = JSON.stringify({
    data: state.data, settings: CONFIG, customerList: state.customerList,
    lastModified: new Date().toISOString(), lastModifiedBy: state.currentUser || 'unknown'
  });
  fetch(GIST_API + '/' + gistId, {
    method: 'PATCH',
    headers: { 'Authorization': 'token ' + GIST_TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { [GIST_FILE]: { content: content } } })
  })
  .then(resp => {
    if (resp.ok) { _lastSyncTime = new Date(); updateSyncIndicator(); }
    else if (resp.status === 404) { createNewBlob(); }
  })
  .catch(() => {});
}

function syncFromServer(onComplete) {
  if (_isSyncing) { if (typeof onComplete === 'function') onComplete(false); return; }
  const gistId = getCurrentBlobId();
  if (!gistId) {
    _isSyncing = true;
    createNewBlob(() => { _isSyncing = false; if (typeof onComplete === 'function') onComplete(false); });
    return;
  }
  _isSyncing = true;
  fetch(GIST_API + '/' + gistId, {
    method: 'GET',
    headers: { 'Authorization': 'token ' + GIST_TOKEN },
    cache: 'no-store'
  })
  .then(resp => {
    if (resp.status === 404) { _isSyncing = false; createNewBlob(); if (typeof onComplete === 'function') onComplete(false); return; }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  })
  .then(gistData => {
    if (!gistData || !gistData.files || !gistData.files[GIST_FILE]) return;
    const raw = gistData.files[GIST_FILE].content;
    if (!raw || raw === '') return;
    let serverData;
    try { serverData = JSON.parse(raw); } catch(e) { return; }
    if (!serverData) return;
    if (serverData.data && Object.keys(serverData.data).length > 0) {
      state.data = serverData.data;
      try { localStorage.setItem('yhs_visit_planner_data', JSON.stringify(state.data)); } catch(e) {}
    }
    if (serverData.settings && Object.keys(serverData.settings).length > 0) {
      CONFIG = Object.assign({}, DEFAULT_CONFIG, serverData.settings);
      try { localStorage.setItem('yhs_vp_settings', JSON.stringify(CONFIG)); } catch(e) {}
    }
    if (serverData.customerList && serverData.customerList.length > 0) {
      state.customerList = serverData.customerList;
      try { localStorage.setItem('yhs_customer_list', JSON.stringify(state.customerList)); } catch(e) {}
    }
    _lastSyncTime = new Date();
    _isSyncing = false;
    updateSyncIndicator();
    if (typeof onComplete === 'function') onComplete(true);
  })
  .catch(() => {
    _isSyncing = false;
    updateSyncIndicator();
    if (typeof onComplete === 'function') onComplete(false);
  });
}

function createNewBlob(onComplete) {
  const content = JSON.stringify({
    data: state.data, settings: CONFIG, customerList: state.customerList,
    lastModified: new Date().toISOString(), lastModifiedBy: state.currentUser || 'unknown'
  });
  fetch(GIST_API, {
    method: 'POST',
    headers: { 'Authorization': 'token ' + GIST_TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ description: 'YHS Sales Visit Planner Data', public: false, files: { [GIST_FILE]: { content: content } } })
  })
  .then(resp => resp.json())
  .then(data => {
    if (data.id) { setBlobId(data.id); _lastSyncTime = new Date(); updateSyncIndicator(); }
    if (typeof onComplete === 'function') onComplete(true);
  })
  .catch(() => { if (typeof onComplete === 'function') onComplete(false); });
}

function startSyncTimer() {
  stopSyncTimer();
  _syncTimer = setInterval(() => { if (!document.hidden) syncFromServer(); }, 30000);
}
function stopSyncTimer() { if (_syncTimer) { clearInterval(_syncTimer); _syncTimer = null; } }

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.currentUser) syncFromServer(() => renderAll());
});

function manualSync() {
  syncToServer();
  syncFromServer(() => { showToast('✓ 數據已同步', 'success'); renderAll(); });
}

function updateSyncIndicator() {
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  if (_lastSyncTime) {
    const sec = Math.floor((new Date() - _lastSyncTime) / 1000);
    el.textContent = '🟢 ' + (sec < 60 ? '已同步' : sec < 3600 ? Math.floor(sec/60) + '分鐘前' : '已同步');
    el.style.color = 'var(--success)';
  } else {
    el.textContent = '🟡 未同步';
    el.style.color = 'var(--warning)';
  }
}

function copyShareUrl() {
  const gistId = getCurrentBlobId();
  if (!gistId) {
    createNewBlob(() => {
      setTimeout(() => {
        const id = getCurrentBlobId();
        if (id) copyLink(id);
      }, 500);
    });
    return;
  }
  copyLink(gistId);
}
function copyLink(id) {
  const baseUrl = window.location.href.split('#')[0];
  const url = baseUrl + '#sync=' + id;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      showToast('✓ 分享連結已複製！發給同事即可（永久有效）', 'success');
    }).catch(() => { window.prompt('請複製此連結發給同事：', url); });
  } else {
    window.prompt('請複製此連結發給同事：', url);
  }
}
function getRepData(rep, periodKey) {
  if (!state.data[periodKey]) state.data[periodKey] = {};
  if (!state.data[periodKey][rep]) state.data[periodKey][rep] = { existing: [], prospecting: [], newCustomers: [] };
  return state.data[periodKey][rep];
}
function getActiveRep() { return state.viewingRep || state.currentUser; }
function initData() {
  loadData(); loadCustomerList();
  state.periodIndex = getCurrentPeriodIndex();
  state.currentPeriod = getAllPeriods()[state.periodIndex];
  // Sync from server, then render
  syncFromServer(() => renderAll());
  startSyncTimer();
}

// ==================== EXPORT / IMPORT ====================
function exportData() {
  const exportObj = { data: state.data, settings: CONFIG, customerList: state.customerList, exportDate: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yhs_visit_data_' + formatDate(new Date()) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('數據已導出', 'success');
}
function showImportModal() { document.getElementById('importModal').classList.add('show'); }
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  // When closing day modal, re-render calendar to reflect changes
  if (id === 'dayModal') {
    renderAll();
  }
}
function confirmDayModal() {
  // Save is already done by individual field handlers (updateField, updateStatus, etc.)
  // Just close modal, which triggers renderAll to refresh the calendar
  closeModal('dayModal');
  showToast('✓ 數據已更新，日曆已刷新', 'success');
}
function handleImportFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const imported = JSON.parse(evt.target.result);
      if (confirm('導入將覆蓋現有數據，是否繼續？')) {
        if (imported.data) state.data = imported.data;
        if (imported.settings) { CONFIG = Object.assign({}, DEFAULT_CONFIG, imported.settings); saveSettingsToStorage(); }
        if (imported.customerList) { state.customerList = imported.customerList; saveCustomerList(); }
        saveData(); renderAll();
        showToast('數據導入成功', 'success'); closeModal('importModal');
      }
    } catch(err) { showToast('文件格式錯誤', 'error'); }
  };
  reader.readAsText(file);
}

// ==================== TOAST ====================
function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'info'); t.textContent = msg;
  c.appendChild(t); setTimeout(() => t.remove(), 3000);
}

// ==================== LOGIN ====================
function initLogin() {
  const select = document.getElementById('userSelect');
  CONFIG.salesReps.forEach(rep => { const o = document.createElement('option'); o.value = rep; o.textContent = rep; select.appendChild(o); });
}
function handleLogin() {
  const user = document.getElementById('userSelect').value;
  const pin = document.getElementById('pinInput').value;
  if (!user) { showToast('請選擇名字', 'error'); return; }
  state.currentUser = user;
  // sales operation needs correct PIN, or any user with manager PIN gets full access
  const isSO = (user === 'sales operation' && pin === CONFIG.soPin);
  const isOldManager = (pin === CONFIG.managerPin);
  state.isManager = isSO || isOldManager;
  // If someone picks "sales operation" without correct PIN, deny
  if (user === 'sales operation' && !state.isManager) {
    showToast('sales operation 需要正確密碼', 'error'); return;
  }
  state.viewingRep = state.isManager ? CONFIG.salesReps.filter(r => r !== 'sales operation')[0] : user;
  state.editingOwn = !state.isManager;
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  const displayName = user;
  document.getElementById('userName').textContent = displayName;
  document.getElementById('userAvatar').textContent = user.charAt(0).toUpperCase();
  document.getElementById('settingsBtn').style.display = state.isManager ? 'inline-flex' : 'none';
  document.getElementById('viewRepBtn').style.display = state.isManager ? 'none' : 'inline-flex';
  initData();
  renderAll();
}
function handleLogout() {
  stopSyncTimer();
  state.currentUser = null; state.isManager = false; state.viewingRep = null;
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('appView').style.display = 'none';
  document.getElementById('pinInput').value = '';
}

function showViewRepDropdown() {
  const select = document.getElementById('viewRepSelect');
  select.innerHTML = '<option value="">-- 選擇 --</option>';
  const reps = state.isManager ? CONFIG.salesReps.filter(r => r !== 'sales operation') : CONFIG.salesReps.filter(r => r !== 'sales operation');
  reps.forEach(rep => {
    const o = document.createElement('option');
    o.value = rep;
    o.textContent = rep === state.currentUser ? rep + ' (我 - 可編輯)' : rep + ' (唯讀)';
    if (rep === state.viewingRep) o.selected = true;
    select.appendChild(o);
  });
  document.getElementById('viewRepModal').classList.add('show');
}
function switchViewRep(repName) {
  if (!repName) return;
  state.viewingRep = repName;
  state.editingOwn = (repName === state.currentUser);
  closeModal('viewRepModal');
  updateViewModeBadge();
  renderAll();
}
function updateViewModeBadge() {
  const badge = document.getElementById('viewModeBadge');
  if (state.isManager) { badge.style.display = 'none'; return; }
  badge.style.display = 'inline';
  if (state.editingOwn) { badge.textContent = '✏️ 編輯模式'; badge.className = 'view-mode-badge editing'; }
  else { badge.textContent = '👁️ 唯讀模式'; badge.className = 'view-mode-badge viewing'; }
}

// ==================== PERIOD NAV ====================
function changePeriod(dir) {
  const periods = getAllPeriods();
  state.periodIndex = Math.max(0, Math.min(periods.length - 1, state.periodIndex + dir));
  state.currentPeriod = periods[state.periodIndex];
  renderAll();
}

// ==================== VIEW SWITCH ====================
function switchView(view) {
  state.currentView = view;
  document.querySelectorAll('.view-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  renderAll();
}

// ==================== RENDER ====================
function renderAll() {
  const period = state.currentPeriod;
  document.getElementById('headerPeriod').textContent = period ? period.range : '';
  updateViewModeBadge();

  const area = document.getElementById('contentArea');
  if (!period) return;

  if (state.currentView === 'calendar') renderCalendarView(area);
  else if (state.currentView === 'list') renderListView(area);
  else if (state.currentView === 'summary') renderSummaryView(area);
}

// ==================== CALENDAR VIEW ====================
function renderCalendarView(container) {
  const period = state.currentPeriod;
  const rep = getActiveRep();
  const data = getRepData(rep, period.start);
  const weeks = getWeeksInPeriod(period.start, period.end);
  const todayStr = formatDate(getToday());

  // Week strip with lock indicators
  let weekStripHtml = '<div class="week-strip">';
  weeks.forEach(w => {
    const locked = isWeekLocked(w.num);
    const active = (getCurrentWeekNum() === w.num) ? 'active' : '';
    const lockCls = locked ? 'locked' : '';
    weekStripHtml += `<div class="week-strip-item ${active} ${lockCls}" onclick="jumpToWeek(${w.num})">
      <div class="ws-num">${w.label}</div><div class="ws-range">${w.range}</div>
      <div class="ws-lock">${locked ? '🔒 已鎖定' : ''}</div></div>`;
  });
  weekStripHtml += '</div>';

  // Stats row
  let statsHtml = renderStatsRow();

  // Manager rep selector
  let mgrSelectorHtml = '';
  if (state.isManager) {
    mgrSelectorHtml = '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">' +
      '<span style="font-size:12px;color:var(--text-light);margin-right:4px;">查看：</span>';
    CONFIG.salesReps.filter(r => r !== 'sales operation').forEach(r => {
      mgrSelectorHtml += '<button class="btn btn-xs ' + (r === state.viewingRep ? 'btn-primary' : 'btn-outline') + '" style="font-size:11px;padding:4px 12px;" onclick="switchViewRep(\'' + r + '\')">' + r + '</button>';
    });
    mgrSelectorHtml += '</div>';
  }

  // Calendar grid
  const startD = parseDate(period.start);
  const endD = parseDate(period.end);
  const gridStart = getMondayBefore(startD);
  const weekdays = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];

  let calHtml = '<div class="calendar-card"><div class="calendar-header">' +
    '<div style="font-size:14px;font-weight:700;">📅 ' + period.label + '</div>' +
    '<div class="calendar-legend">' +
    '<span class="legend-item"><span class="legend-dot" style="background:var(--existing)"></span>E:計劃/已訪</span>' +
    '<span class="legend-item"><span class="legend-dot" style="background:var(--prospecting)"></span>P:潛在客戶</span>' +
    '<span class="legend-item"><span class="legend-dot" style="background:var(--new)"></span>N:新客戶</span>' +
    '</div></div>';

  calHtml += '<div class="calendar-grid">';
  weekdays.forEach(wd => { calHtml += '<div class="cal-weekday">' + wd + '</div>'; });

  let cur = new Date(gridStart);
  while (cur <= endD) {
    for (let i = 0; i < 7; i++) {
      const dateStr = formatDate(cur);
      const inPeriod = cur >= startD && cur <= endD;
      const isToday = dateStr === todayStr;
      const weekNum = getWeekForDate(dateStr, period.start, period.end);
      const locked = isWeekLocked(weekNum) && inPeriod;

      // Count items for this day
      const existing = (data.existing || []).filter(e => e.plannedDate === dateStr);
      const prospecting = (data.prospecting || []).filter(e => e.date === dateStr);
      const newC = (data.newCustomers || []).filter(e => e.date === dateStr);
      const total = existing.length + prospecting.length + newC.length;

      let classes = 'cal-day';
      if (!inPeriod) classes += ' other-month';
      if (isToday) classes += ' today';
      if (locked) classes += ' locked';

      let badgesHtml = '<div class="cal-badges">';
      // Existing: show planned vs visited + area info
      if (existing.length) {
        const eVisited = existing.filter(e => e.status === 'visited').length;
        badgesHtml += '<span class="cal-badge existing">E:' + existing.length + '/' + eVisited + '</span>';
        // Show areas
        const areas = [];
        existing.forEach(e => {
          const cust = findCustomerByName(e.customer);
          if (cust && cust.area && areas.indexOf(cust.area) === -1) areas.push(cust.area);
        });
        if (areas.length) {
          badgesHtml += '<span class="cal-area">' + areas.join('/') + '</span>';
        }
      }
      // Prospecting: show customer name preview
      if (prospecting.length) {
        const pComp = prospecting.filter(e => e.status === 'completed').length;
        const pText = prospecting[0].customerName ? prospecting[0].customerName.substring(0, 10) : '';
        badgesHtml += '<span class="cal-badge prospecting">P:' + prospecting.length + (pComp ? ' ✓' + pComp : '') + (pText ? ' ' + pText : '') + '</span>';
      }
      // New: show customer name preview
      if (newC.length) {
        const nComp = newC.filter(e => e.status === 'completed').length;
        const nText = newC[0].customerName ? newC[0].customerName.substring(0, 10) : '';
        badgesHtml += '<span class="cal-badge new">N:' + newC.length + (nComp ? ' ✓' + nComp : '') + (nText ? ' ' + nText : '') + '</span>';
      }
      badgesHtml += '</div>';

      const dayNum = cur.getDate();
      const showMonth = (dayNum === 1 || (cur === gridStart));
      const monthTag = showMonth ? ' <span class="month-tag">' + (cur.getMonth() + 1) + '月</span>' : '';

      calHtml += '<div class="' + classes + '" onclick="openDayModal(\'' + dateStr + '\')" ' + (inPeriod ? '' : 'style="cursor:default;"') + '>'
        + '<div class="cal-day-num">' + dayNum + monthTag + '</div>'
        + badgesHtml
        + (total > 0 ? '<div class="cal-count">' + total + ' 項</div>' : '')
        + '</div>';

      cur.setDate(cur.getDate() + 1);
      if (cur > endD && i < 6) {
        // fill remaining cells
        for (let j = i + 1; j < 7; j++) {
          calHtml += '<div class="cal-day other-month"></div>';
        }
        break;
      }
    }
  }
  calHtml += '</div></div>';

  container.innerHTML = statsHtml + mgrSelectorHtml + weekStripHtml + calHtml;
}

function jumpToWeek(weekNum) {
  // In calendar view, scroll to that week or just show a toast
  const weeks = getWeeksInPeriod(state.currentPeriod.start, state.currentPeriod.end);
  const w = weeks.find(x => x.num === weekNum);
  if (w) showToast(w.label + ' (' + w.range + ')', 'info');
}

// ==================== STATS ROW ====================
function renderStatsRow() {
  const period = state.currentPeriod;
  const rep = getActiveRep();
  const data = getRepData(rep, period.start);
  const repsToCount = state.isManager ? CONFIG.salesReps.filter(r => r !== 'sales operation') : [rep];

  const categories = [
    { key: 'existing', label: 'Existing Customer', color: 'existing' },
    { key: 'prospecting', label: 'Prospecting', color: 'prospecting' },
    { key: 'newCustomers', label: 'New Customer', color: 'new' }
  ];

  let html = '<div class="stats-row">';
  categories.forEach(cat => {
    let total = 0, done = 0;
    repsToCount.forEach(r => {
      const d = getRepData(r, period.start);
      (d[cat.key] || []).forEach(item => {
        total++;
        if (item.status === 'visited' || item.status === 'completed') done++;
      });
    });
    html += `<div class="stat-card ${cat.color}">
      <div class="stat-label">${cat.label}</div><div class="stat-value">${total}</div>
      <div class="stat-detail"><span class="done">已完成: ${done}</span></div></div>`;
  });

  // Week lock status
  const todayWeek = getCurrentWeekNum();
  const locked = isWeekLocked(todayWeek);
  html += `<div class="stat-card" style="border-left-color:${locked ? 'var(--danger)' : 'var(--success)'}">
    <div class="stat-label">本週狀態 (第${todayWeek}週)</div>
    <div class="stat-value" style="font-size:16px;">${locked ? '🔒 已鎖定' : '🔓 可編輯'}</div>
    <div class="stat-detail">${state.isManager ? 'sales operation 可修改' : (locked ? '週一開會用' : '週日前可填寫')}</div></div>`;

  html += '</div>';
  return html;
}

// ==================== DAY MODAL ====================
function openDayModal(dateStr) {
  const period = state.currentPeriod;
  if (!period) return;
  const d = parseDate(dateStr);
  const startD = parseDate(period.start), endD = parseDate(period.end);
  if (d < startD || d > endD) return;

  const weekNum = getWeekForDate(dateStr, period.start, period.end);
  const locked = isWeekLocked(weekNum);
  const canEdit = canEditWeek(weekNum);
  const rep = getActiveRep();
  const data = getRepData(rep, period.start);

  const existing = (data.existing || []).filter(e => e.plannedDate === dateStr);
  const prospecting = (data.prospecting || []).filter(e => e.date === dateStr);
  const newC = (data.newCustomers || []).filter(e => e.date === dateStr);

  state.selectedDate = dateStr;
  const dateDisplay = d.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('dayModalTitle').textContent = dateDisplay + (locked ? ' 🔒' : '');

  let html = '';

  // Lock warning
  if (locked && !state.isManager) {
    html += '<div class="lock-banner">🔒 <strong>本週數據已鎖定</strong>（週日晚12點自動鎖定）。如需修改，請聯繫 sales operation。</div>';
  }
  if (locked && state.isManager) {
    html += '<div class="lock-banner" style="background:#fef5e7;color:var(--warning);">⚠️ 本週已鎖定，但你有完整權限，仍可修改。</div>';
  }

  // Existing Customer section
  html += '<div class="section-card"><div class="section-header">' +
    '<div class="section-title"><span class="dot existing"></span>Existing Customer (現有客戶)</div>' +
    '<div class="section-count">' + existing.length + ' 筆</div></div><div class="section-body">';

  html += '<table class="visit-table"><thead><tr>' +
    '<th style="min-width:200px;">客戶名稱</th><th style="width:90px;">狀態</th>' +
    '<th>備註</th><th style="width:30px;"></th></tr></thead><tbody>';

  if (existing.length === 0) {
    html += '<tr class="empty-row"><td colspan="4">當日暫無拜訪計劃</td></tr>';
  } else {
    existing.forEach(item => {
      html += `<tr data-id="${item.id}">
        <td class="autocomplete-cell">${canEdit ? renderAutocompleteInput(item) : '<strong>' + (item.customer || '-') + '</strong>'}</td>
        <td>${canEdit ? renderStatusSelect('existing', item) : '<span class="status-select status-' + (item.status||'planned') + '">' + (STATUS_OPTIONS.find(s=>s.value===item.status)?.label||'計劃中') + '</span>'}</td>
        <td>${canEdit ? '<textarea placeholder="備註" rows="1" onchange="updateField(\'existing\',\'' + item.id + '\',\'notes\',this.value)">' + (item.notes||'') + '</textarea>' : (item.notes||'-')}</td>
        <td>${canEdit ? '<button class="delete-btn" onclick="deleteRow(\'existing\',\'' + item.id + '\')">🗑</button>' : ''}</td></tr>`;
    });
  }
  html += '</tbody></table>';
  if (canEdit) html += '<button class="add-row-btn" onclick="addExistingForDay(\'' + dateStr + '\')">+ 新增拜訪客戶</button>';
  html += '</div></div>';

  // Prospecting section
  html += renderTaskSection('prospecting', 'Prospecting Customer (潛在客戶)', prospecting, canEdit, dateStr);

  // New Customer section
  html += renderTaskSection('newCustomers', 'New Customer (新客戶)', newC, canEdit, dateStr);

  document.getElementById('dayModalBody').innerHTML = html;
  document.getElementById('dayModal').classList.add('show');
}

function renderTaskSection(key, title, items, canEdit, dateStr) {
  const dotClass = key === 'prospecting' ? 'prospecting' : 'new';
  const notesLabel = key === 'prospecting' ? '新品/計劃' : '備註';
  const notesPlaceholder = key === 'prospecting' ? '預計要做的新品或計劃...' : '備註...';
  let html = '<div class="section-card"><div class="section-header">' +
    '<div class="section-title"><span class="dot ' + dotClass + '"></span>' + title + '</div>' +
    '<div class="section-count">' + items.length + ' 筆</div></div><div class="section-body">';

  if (items.length === 0) {
    html += '<div style="text-align:center;color:var(--text-light);padding:16px;font-size:12px;">暫無記錄</div>';
  } else {
    html += '<div class="task-cards">';
    items.forEach(item => {
      const status = TASK_STATUS.find(s => s.value === item.status) || TASK_STATUS[0];
      html += `<div class="task-card ${dotClass}">
        <div class="tc-header">
          <div class="tc-date">${item.date || '-'}</div>
          <span class="tc-status ${item.status||'in-progress'}">${status.label}</span>
        </div>
        <div class="tc-field"><label>客戶姓名</label>${canEdit ? '<input type="text" placeholder="輸入客戶姓名..." value="' + (item.customerName||'').replace(/"/g,'&quot;') + '" onchange="updateField(\'' + key + '\',\'' + item.id + '\',\'customerName\',this.value)">' : '<div style="font-size:13px;font-weight:600;">' + (item.customerName||'-') + '</div>'}</div>
        <div class="tc-field"><label>${notesLabel}</label>${canEdit ? '<textarea placeholder="' + notesPlaceholder + '" onchange="updateField(\'' + key + '\',\'' + item.id + '\',\'notes\',this.value)">' + (item.notes||'') + '</textarea>' : '<div style="font-size:13px;">' + (item.notes||'-') + '</div>'}</div>
        <div class="tc-field"><label>狀態（當周反饋）</label>${canEdit ? '<select onchange="updateField(\'' + key + '\',\'' + item.id + '\',\'status\',this.value)">' + TASK_STATUS.map(s => '<option value="' + s.value + '" ' + (item.status===s.value?'selected':'') + '>' + s.label + '</option>').join('') + '</select>' : '<span class="tc-status ' + (item.status||'in-progress') + '">' + status.label + '</span>'}</div>
        <div class="tc-footer">${canEdit ? '<button class="delete-btn" onclick="deleteRow(\'' + key + '\',\'' + item.id + '\')">🗑 刪除</button>' : ''}</div>
      </div>`;
    });
    html += '</div>';
  }
  if (canEdit) {
    html += '<button class="add-row-btn" onclick="addTask(\'' + key + '\',\'' + dateStr + '\')">+ 新增' + (key === 'prospecting' ? '潛在客戶' : '新客戶') + '</button>';
  }
  html += '</div></div>';
  return html;
}

function renderStatusSelect(cat, item) {
  const opts = STATUS_OPTIONS.map(o => '<option value="' + o.value + '" ' + (item.status===o.value?'selected':'') + '>' + o.label + '</option>').join('');
  return '<select class="status-select status-' + (item.status||'planned') + '" onchange="updateStatus(\'' + cat + '\',\'' + item.id + '\',this)">' + opts + '</select>';
}

// ==================== AUTOCOMPLETE ====================
function renderAutocompleteInput(item) {
  return `<div class="autocomplete-wrap">
    <input type="text" class="ac-input" value="${(item.customer||'').replace(/"/g,'&quot;')}" placeholder="輸入客戶名稱搜索..." data-id="${item.id}" autocomplete="off"
      oninput="handleAcInput(this)" onfocus="handleAcFocus(this)" onblur="handleAcBlur(this)"
      onchange="updateField('existing','${item.id}','customer',this.value)">
    <div class="autocomplete-dropdown"></div></div>`;
}

let acTimeout = null;
function handleAcInput(input) {
  clearTimeout(acTimeout);
  const query = input.value.trim();
  const dropdown = input.parentElement.querySelector('.autocomplete-dropdown');
  if (query.length < 1) { dropdown.classList.remove('show'); return; }
  acTimeout = setTimeout(() => {
    const results = searchCustomers(query, true).slice(0, 8);
    if (results.length === 0) { dropdown.classList.remove('show'); return; }
    dropdown.innerHTML = results.map(c => {
      const display = getCustomerDisplayName(c).replace(/"/g, '&quot;');
      return '<div class="ac-item" data-name="' + display + '" data-code="' + (c.code||'') + '">' + getCustomerDisplayName(c) + '</div>';
    }).join('');
    dropdown.querySelectorAll('.ac-item').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        input.value = this.dataset.name.replace(/&quot;/g, '"');
        const id = input.dataset.id;
        updateField('existing', id, 'customer', input.value);
        updateField('existing', id, 'customerCode', this.dataset.code);
        // Also store area info
        const cust = findCustomerByName(this.dataset.name.replace(/&quot;/g, '"'));
        if (cust && cust.area) updateField('existing', id, 'area', cust.area);
        dropdown.classList.remove('show');
      });
    });
    dropdown.classList.add('show');
  }, 150);
}
function handleAcFocus(input) { if (input.value.trim().length >= 1) handleAcInput(input); }
function handleAcBlur(input) { setTimeout(() => { const dd = input.parentElement.querySelector('.autocomplete-dropdown'); if (dd) dd.classList.remove('show'); }, 200); }

// ==================== LIST VIEW ====================
function renderListView(container) {
  const period = state.currentPeriod;
  const rep = getActiveRep();
  const data = getRepData(rep, period.start);
  const weeks = getWeeksInPeriod(period.start, period.end);

  let html = renderStatsRow();

  // Manager rep selector
  if (state.isManager) {
    html += '<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">' +
      '<span style="font-size:12px;color:var(--text-light);">查看：</span>';
    CONFIG.salesReps.forEach(r => {
      html += '<button class="btn btn-xs ' + (r === state.viewingRep ? 'btn-primary' : 'btn-outline') + '" style="font-size:11px;padding:4px 12px;" onclick="switchViewRep(\'' + r + '\')">' + r + '</button>';
    });
    html += '</div>';
  }

  // Week strip
  html += '<div class="week-strip">';
  // Default to the first week that has data, fallback to current week
  if (!state._listWeek) {
    state._listWeek = getCurrentWeekNum();
    for (const w of weeks) {
      const hasData = (data.existing || []).some(e => (e.week || getWeekForDate(e.plannedDate, period.start, period.end)) === w.num)
        || (data.prospecting || []).some(e => (e.week || getWeekForDate(e.date, period.start, period.end)) === w.num)
        || (data.newCustomers || []).some(e => (e.week || getWeekForDate(e.date, period.start, period.end)) === w.num);
      if (hasData) { state._listWeek = w.num; break; }
    }
  }
  weeks.forEach(w => {
    const locked = isWeekLocked(w.num);
    const active = (state._listWeek === w.num) ? 'active' : '';
    html += `<div class="week-strip-item ${active} ${locked?'locked':''}" onclick="state._listWeek=${w.num};renderAll();">
      <div class="ws-num">${w.label}</div><div class="ws-range">${w.range}</div>
      <div class="ws-lock">${locked?'🔒':''}</div></div>`;
  });
  html += '</div>';

  const weekNum = state._listWeek;
  const canEdit = canEditWeek(weekNum);

  if (!canEdit) {
    html += '<div class="lock-banner">🔒 <strong>第' + weekNum + '週數據已鎖定</strong>。如需修改，請聯繫 sales operation。</div>';
  }

  // Existing customer table for this week
  const weekExisting = (data.existing || []).filter(e => {
    const iw = e.week || getWeekForDate(e.plannedDate, period.start, period.end);
    return iw === weekNum;
  });

  html += '<div class="section-card"><div class="section-header">' +
    '<div class="section-title"><span class="dot existing"></span>Existing Customer — 第' + weekNum + '週</div>' +
    '<div class="section-count">' + weekExisting.length + ' 筆</div></div><div class="section-body">';

  html += '<table class="visit-table"><thead><tr>' +
    '<th style="min-width:200px;">客戶名稱</th><th style="width:105px;">計劃日期</th><th style="width:90px;">狀態</th>' +
    '<th>備註</th><th style="width:30px;"></th></tr></thead><tbody>';

  if (weekExisting.length === 0) {
    html += '<tr class="empty-row"><td colspan="5">本週暫無拜訪計劃</td></tr>';
  } else {
    weekExisting.forEach(item => {
      html += `<tr data-id="${item.id}">
        <td class="autocomplete-cell">${canEdit ? renderAutocompleteInput(item) : '<strong>' + (item.customer||'-') + '</strong>'}</td>
        <td>${canEdit ? '<input type="date" value="' + (item.plannedDate||'') + '" onchange="updateField(\'existing\',\'' + item.id + '\',\'plannedDate\',this.value)">' : (item.plannedDate||'-')}</td>
        <td>${canEdit ? renderStatusSelect('existing', item) : '<span class="status-select status-' + (item.status||'planned') + '">' + (STATUS_OPTIONS.find(s=>s.value===item.status)?.label||'計劃中') + '</span>'}</td>
        <td>${canEdit ? '<textarea placeholder="備註" rows="1" onchange="updateField(\'existing\',\'' + item.id + '\',\'notes\',this.value)">' + (item.notes||'') + '</textarea>' : (item.notes||'-')}</td>
        <td>${canEdit ? '<button class="delete-btn" onclick="deleteRow(\'existing\',\'' + item.id + '\')">🗑</button>' : ''}</td></tr>`;
    });
  }
  html += '</tbody></table>';
  if (canEdit) html += '<button class="add-row-btn" onclick="addExistingForWeek(' + weekNum + ')">+ 新增客戶拜訪計劃</button>';
  html += '</div></div>';

  // Prospecting & New for this week
  ['prospecting', 'newCustomers'].forEach(key => {
    const title = key === 'prospecting' ? 'Prospecting Customer (潛在客戶)' : 'New Customer (新客戶)';
    const notesLabel = key === 'prospecting' ? '新品/計劃' : '備註';
    const items = (data[key] || []).filter(e => {
      const iw = e.week || getWeekForDate(e.date, period.start, period.end);
      return iw === weekNum;
    });
    const dotClass = key === 'prospecting' ? 'prospecting' : 'new';
    html += '<div class="section-card"><div class="section-header">' +
      '<div class="section-title"><span class="dot ' + dotClass + '"></span>' + title + ' — 第' + weekNum + '週</div>' +
      '<div class="section-count">' + items.length + ' 筆</div></div><div class="section-body">';

    if (items.length === 0) {
      html += '<div style="text-align:center;color:var(--text-light);padding:16px;font-size:12px;">暫無記錄</div>';
    } else {
      html += '<div class="task-cards">';
      items.forEach(item => {
        const status = TASK_STATUS.find(s => s.value === item.status) || TASK_STATUS[0];
        html += `<div class="task-card ${dotClass}">
          <div class="tc-header"><div class="tc-date">${item.date||'-'}</div><span class="tc-status ${item.status||'in-progress'}">${status.label}</span></div>
          <div class="tc-field"><label>客戶姓名</label>${canEdit ? '<input type="text" placeholder="輸入客戶姓名..." value="' + (item.customerName||'').replace(/"/g,'&quot;') + '" onchange="updateField(\'' + key + '\',\'' + item.id + '\',\'customerName\',this.value)">' : '<div style="font-size:13px;font-weight:600;">' + (item.customerName||'-') + '</div>'}</div>
          <div class="tc-field"><label>${notesLabel}</label>${canEdit ? '<textarea placeholder="' + (key==='prospecting'?'預計要做的新品或計劃...':'備註...') + '" onchange="updateField(\'' + key + '\',\'' + item.id + '\',\'notes\',this.value)">' + (item.notes||'') + '</textarea>' : '<div style="font-size:13px;">' + (item.notes||'-') + '</div>'}</div>
          <div class="tc-field"><label>狀態</label>${canEdit ? '<select onchange="updateField(\'' + key + '\',\'' + item.id + '\',\'status\',this.value)">' + TASK_STATUS.map(s=>'<option value="'+s.value+'" '+(item.status===s.value?'selected':'')+'>'+s.label+'</option>').join('') + '</select>' : '<span class="tc-status ' + (item.status||'in-progress') + '">' + status.label + '</span>'}</div>
          <div class="tc-footer">${canEdit ? '<button class="delete-btn" onclick="deleteRow(\'' + key + '\',\'' + item.id + '\')">🗑 刪除</button>' : ''}</div></div>`;
      });
      html += '</div>';
    }
    const weekStart = weeks.find(w => w.num === weekNum);
    if (canEdit && weekStart) html += '<button class="add-row-btn" onclick="addTask(\'' + key + '\',\'' + weekStart.start + '\')">+ 新增' + (key==='prospecting'?'潛在客戶':'新客戶') + '</button>';
    html += '</div></div>';
  });

  container.innerHTML = html;
}

// ==================== SUMMARY VIEW ====================
function renderSummaryView(container) {
  const period = state.currentPeriod;
  const weeks = getWeeksInPeriod(period.start, period.end);
  const reps = state.isManager ? CONFIG.salesReps.filter(r => r !== 'sales operation') : [getActiveRep()];

  let html = '<div class="section-card"><div class="section-header">' +
    '<div class="section-title">📊 月度匯總 — ' + period.label + '</div></div><div class="section-body">';

  // Per-rep summary table
  html += '<table class="summary-table"><thead><tr>' +
    '<th style="text-align:left;">業務員<br><span style="font-size:9px;font-weight:400;">(計劃/已訪)</span></th>';
  weeks.forEach(w => { html += '<th>' + w.label + '<br><span style="font-size:9px;font-weight:400;">' + w.range + '</span></th>'; });
  html += '<th>合計</th></tr></thead><tbody>';

  let grandTotal = { planned: 0, visited: 0 };

  reps.forEach(rep => {
    const data = getRepData(rep, period.start);
    html += '<tr><td class="rep-name">' + rep + '</td>';
    let repTotal = { planned: 0, visited: 0 };
    weeks.forEach(w => {
      const weekItems = (data.existing || []).filter(e => {
        const iw = e.week || getWeekForDate(e.plannedDate, period.start, period.end);
        return iw === w.num;
      });
      const visited = weekItems.filter(e => e.status === 'visited').length;
      repTotal.planned += weekItems.length;
      repTotal.visited += visited;
      html += '<td>' + weekItems.length + ' / <span style="color:var(--success);font-weight:600;">' + visited + '</span></td>';
    });
    grandTotal.planned += repTotal.planned;
    grandTotal.visited += repTotal.visited;
    html += '<td><strong>' + repTotal.planned + '</strong> / <span style="color:var(--success);font-weight:600;">' + repTotal.visited + '</span></td></tr>';
  });

  html += '<tr class="total-row"><td class="rep-name">合計</td>';
  weeks.forEach(w => {
    let p = 0, v = 0;
    reps.forEach(rep => {
      const data = getRepData(rep, period.start);
      const weekItems = (data.existing || []).filter(e => {
        const iw = e.week || getWeekForDate(e.plannedDate, period.start, period.end);
        return iw === w.num;
      });
      p += weekItems.length;
      v += weekItems.filter(e => e.status === 'visited').length;
    });
    html += '<td>' + p + ' / <span style="color:var(--success);">' + v + '</span></td>';
  });
  html += '<td>' + grandTotal.planned + ' / <span style="color:var(--success);">' + grandTotal.visited + '</span></td></tr>';

  html += '</tbody></table>';
  html += '</div></div>';

  // Prospecting & New summary
  ['prospecting', 'newCustomers'].forEach(key => {
    const title = key === 'prospecting' ? 'Prospecting Customer 匯總' : 'New Customer 匯總';
    const dotClass = key === 'prospecting' ? 'prospecting' : 'new';
    html += '<div class="section-card"><div class="section-header">' +
      '<div class="section-title"><span class="dot ' + dotClass + '"></span>' + title + '</div></div><div class="section-body">';
    html += '<table class="summary-table"><thead><tr><th style="text-align:left;">業務員<br><span style="font-size:9px;font-weight:400;">(計劃/完成)</span></th>';
    weeks.forEach(w => { html += '<th>' + w.label + '</th>'; });
    html += '<th>合計</th></tr></thead><tbody>';
    let grandP = 0, grandC = 0;
    reps.forEach(rep => {
      const items = getRepData(rep, period.start)[key] || [];
      html += '<tr><td class="rep-name">' + rep + '</td>';
      let repP = 0, repC = 0;
      weeks.forEach(w => {
        const weekItems = items.filter(i => {
          const iw = i.week || getWeekForDate(i.date, period.start, period.end);
          return iw === w.num;
        });
        const done = weekItems.filter(i => i.status === 'completed').length;
        repP += weekItems.length; repC += done;
        html += '<td>' + weekItems.length + ' / <span style="color:var(--success);font-weight:600;">' + done + '</span></td>';
      });
      grandP += repP; grandC += repC;
      html += '<td><strong>' + repP + '</strong> / <span style="color:var(--success);font-weight:600;">' + repC + '</span></td></tr>';
    });
    html += '<tr class="total-row"><td class="rep-name">合計</td>';
    weeks.forEach(w => {
      let p = 0, c = 0;
      reps.forEach(rep => {
        const items = getRepData(rep, period.start)[key] || [];
        const weekItems = items.filter(i => { const iw = i.week || getWeekForDate(i.date, period.start, period.end); return iw === w.num; });
        p += weekItems.length; c += weekItems.filter(i => i.status === 'completed').length;
      });
      html += '<td>' + p + ' / <span style="color:var(--success);">' + c + '</span></td>';
    });
    html += '<td>' + grandP + ' / <span style="color:var(--success);">' + grandC + '</span></td></tr>';
    html += '</tbody></table></div></div>';
  });

  container.innerHTML = html;
}

// ==================== DATA OPERATIONS ====================
function updateField(category, id, field, value) {
  if (!canEditWeek(getCurrentWeekNum()) && !state.isManager && state.editingOwn) {
    // For day modal, check based on the item's date
  }
  const period = state.currentPeriod;
  const rep = getActiveRep();
  if (!state.isManager && !state.editingOwn) return;

  // Check lock based on item's week
  const data = getRepData(rep, period.start);
  const items = data[category];
  const item = items.find(i => i.id === id);
  if (!item) return;

  // Check if this item's week is locked
  const dateStr = item.plannedDate || item.date;
  if (dateStr) {
    const weekNum = getWeekForDate(dateStr, period.start, period.end);
    if (!canEditWeek(weekNum)) return;
  }

  item[field] = value;
  if (field === 'plannedDate' && value) item.week = getWeekForDate(value, period.start, period.end);
  if (field === 'date' && value) item.week = getWeekForDate(value, period.start, period.end);
  saveData();
}

function updateStatus(category, id, selectEl) {
  const period = state.currentPeriod;
  const rep = getActiveRep();
  if (!state.isManager && !state.editingOwn) return;
  const data = getRepData(rep, period.start);
  const item = (data[category] || []).find(i => i.id === id);
  if (!item) return;
  const dateStr = item.plannedDate || item.date;
  if (dateStr) {
    const weekNum = getWeekForDate(dateStr, period.start, period.end);
    if (!canEditWeek(weekNum)) return;
  }
  item.status = selectEl.value;
  selectEl.className = 'status-select status-' + selectEl.value;
  if (selectEl.value === 'visited' && !item.actualDate) item.actualDate = formatDate(new Date());
  saveData();
}

function addExistingForDay(dateStr) {
  const period = state.currentPeriod;
  if (!state.isManager && !state.editingOwn) return;
  const weekNum = getWeekForDate(dateStr, period.start, period.end);
  if (!canEditWeek(weekNum)) { showToast('本週已鎖定，無法新增', 'error'); return; }
  const data = getRepData(getActiveRep(), period.start);
  const newItem = { id: generateId(), customer: '', customerCode: '', plannedDate: dateStr, status: 'planned', notes: '', actualDate: '', week: weekNum };
  data.existing.push(newItem);
  saveData();
  state.selectedDate = dateStr;
  openDayModal(dateStr);
  setTimeout(() => { const inp = document.querySelector('tr[data-id="' + newItem.id + '"] input.ac-input'); if (inp) inp.focus(); }, 100);
}

function addExistingForWeek(weekNum) {
  const period = state.currentPeriod;
  if (!state.isManager && !state.editingOwn) return;
  if (!canEditWeek(weekNum)) { showToast('本週已鎖定，無法新增', 'error'); return; }
  const weeks = getWeeksInPeriod(period.start, period.end);
  const week = weeks.find(w => w.num === weekNum);
  const data = getRepData(getActiveRep(), period.start);
  const newItem = { id: generateId(), customer: '', customerCode: '', plannedDate: week ? week.start : period.start, status: 'planned', notes: '', actualDate: '', week: weekNum };
  data.existing.push(newItem);
  saveData();
  renderAll();
  setTimeout(() => { const inp = document.querySelector('tr[data-id="' + newItem.id + '"] input.ac-input'); if (inp) inp.focus(); }, 100);
}

function addTask(key, dateStr) {
  const period = state.currentPeriod;
  if (!state.isManager && !state.editingOwn) return;
  const weekNum = getWeekForDate(dateStr, period.start, period.end);
  if (!canEditWeek(weekNum)) { showToast('本週已鎖定，無法新增', 'error'); return; }
  const data = getRepData(getActiveRep(), period.start);
  const newItem = { id: generateId(), date: dateStr, customerName: '', notes: '', status: 'in-progress', week: weekNum };
  data[key].push(newItem);
  saveData();
  // Re-render
  if (document.getElementById('dayModal').classList.contains('show')) {
    openDayModal(dateStr);
  } else {
    renderAll();
  }
}

function deleteRow(category, id) {
  if (!state.isManager && !state.editingOwn) return;
  if (!confirm('確定要刪除這筆記錄嗎？')) return;
  const period = state.currentPeriod;
  const data = getRepData(getActiveRep(), period.start);
  const item = (data[category] || []).find(i => i.id === id);
  if (item) {
    const dateStr = item.plannedDate || item.date;
    if (dateStr) {
      const weekNum = getWeekForDate(dateStr, period.start, period.end);
      if (!canEditWeek(weekNum)) { showToast('本週已鎖定，無法刪除', 'error'); return; }
    }
  }
  data[category] = data[category].filter(i => i.id !== id);
  saveData();
  if (document.getElementById('dayModal').classList.contains('show') && state.selectedDate) {
    openDayModal(state.selectedDate);
  } else {
    renderAll();
  }
}

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded', () => {
  loadSettings();
  initLogin();
});
</script>
